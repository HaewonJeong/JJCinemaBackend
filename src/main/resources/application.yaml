spring:
  application:
    name: jjcinema
  datasource:
    # url: jdbc:postgresql://localhost:5432/jjcinema_db
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jjcinema_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
# 크로스 사이트(cross-site) 요청 추가
server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
